services:
  - type: web
    name: smart-wild-orchestrator
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: SSE_TEST_BROADCAST_ENABLED
        value: "true"
      - key: SSE_TEST_BROADCAST_ON_START
        value: "true"
